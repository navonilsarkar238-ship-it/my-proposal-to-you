<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aditi 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2c163a 0%, #100818 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Romantic Dynamic Background Animation */
        .background-effects {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 107, 139, 0.4);
            font-size: 20px;
            animation: floatUp 5s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Container with Shock Pulse Animation */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 182, 193, 0.4);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 107, 139, 0.3);
            animation: shockPulse 3s infinite ease-in-out;
        }

        @keyframes shockPulse {
            0%, 100% { transform: scale(1); border-color: rgba(255, 182, 193, 0.4); }
            50% { transform: scale(1.02); border-color: rgba(255, 107, 139, 0.8); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 75, 114, 0.6); }
        }

        /* Message Box with Zoom-Pop Animation */
        .message-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .shock-pop {
            animation: shockPopAnimation 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shockPopAnimation {
            0% {
                transform: scale(0.1) rotate(-10deg);
                opacity: 0;
                filter: blur(10px);
            }
            70% {
                transform: scale(1.1) rotate(2deg);
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
            }
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.8rem;
            color: #ff7597;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 117, 151, 0.8);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #fce4ec;
        }

        /* Button Styling */
        .btn {
            background: linear-gradient(135deg, #ff6b8b 0%, #ff4b72 100%);
            border: none;
            padding: 12px 32px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 114, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 75, 114, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Exploding Glitter & Sparkles Effect */
        .glitter {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #fff 0%, #ff8da1 60%, transparent 100%);
            border-radius: 50%;
            animation: burst 1.2s forwards ease-out;
            z-index: 20;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Animation Layer -->
    <div class="background-effects" id="bg-effects"></div>

    <div class="container" id="main-container">
        <!-- Message Box -->
        <div class="message-box shock-pop" id="msg-box">
            <h1 id="title">Hey Aditi... ✨</h1>
            <p id="dynamic-text">I made this little surprise just for you. Click below to open your heart-filled message!</p>
        </div>
        <button class="btn" id="next-btn" onclick="nextStep()">Open Message 💖</button>
    </div>

    <script>
        // Starry Background Generator
        const bgEffects = document.getElementById('bg-effects');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3}px`;
            star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${1 + Math.random() * 3}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            bgEffects.appendChild(star);
        }

        // Floating Romantic Hearts Generator
        const heartSymbols = ['💖', '✨', '💕', '💗', '⭐'];
        for (let i = 0; i < 18; i++) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.animationDuration = `${3.5 + Math.random() * 3}s`;
            heart.style.animationDelay = `${Math.random() * 4}s`;
            heart.style.fontSize = `${Math.random() * 18 + 14}px`;
            bgEffects.appendChild(heart);
        }

        // Sequence of Messages including your specific lines
        const steps = [
            {
                title: "Hey Aditi... ✨",
                text: "I made this little surprise just for you. Click below to open your heart-filled message!"
            },
            {
                title: "Thank You 🌸",
                text: "First of all, thank you so much for your wonderful friendship and for always bringing so much brightness into my life."
            },
            {
                title: "An Idiot's Apology 😅",
                text: "And a massive thank you for tolerating this absolute idiot all this time. You genuinely deserve a medal for your patience!"
            },
            {
                title: "A Little Secret 💫",
                text: "Every conversation with you is the best part of my day, and seeing you smile means everything to me."
            },
            {
                title: "My Proposal 💖",
                text: "Aditi, you mean the absolute world to me. Will you make me the happiest and be mine? ✨"
            }
        ];

        let currentStep = 0;
        const titleEl = document.getElementById('title');
        const textEl = document.getElementById('dynamic-text');
        const btnEl = document.getElementById('next-btn');
        const msgBoxEl = document.getElementById('msg-box');
        const containerEl = document.getElementById('main-container');

        function nextStep() {
            currentStep++;

            if (currentStep < steps.length) {
                titleEl.innerText = steps[currentStep].title;
                textEl.innerText = steps[currentStep].text;
                
                if (currentStep === steps.length - 1) {
                    btnEl.innerText = "Yes! ❤️";
                }
            } else {
                // Final Ending State
                titleEl.innerText = "I love Aditi ❤️";
                textEl.innerText = "Forever and always! 🥰";
                btnEl.style.display = "none";

                // Extra massive shock burst on the final screen
                createGlitterBurst();

                // Automatically close or go back after a short romantic pause (3.5 seconds)
                setTimeout(() => {
                    // Attempts to close or redirect back to the previous window/chat tab
                    window.close();
                    
                    // Fallback redirect if the browser blocks automatic closing script permissions
                    setTimeout(() => {
                        window.location.href = "about:blank";
                    }, 500);
                }, 3500);
                return;
            }

            // Trigger Shock Pop-In Animation on Box
            msgBoxEl.classList.remove('shock-pop');
            void msgBoxEl.offsetWidth; // Force Reflow
            msgBoxEl.classList.add('shock-pop');

            // Trigger Massive Glitter & Sparkle Explosion Burst
            createGlitterBurst();
        }

        // Exploding Glitter & Sparkles Burst Function
        function createGlitterBurst() {
            const rect = containerEl.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 70; i++) {
                const glitter = document.createElement('div');
                glitter.classList.add('glitter');
                
                const size = Math.random() * 12 + 4;
                glitter.style.width = `${size}px`;
                glitter.style.height = `${size}px`;
                glitter.style.left = `${x}px`;
                glitter.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                glitter.style.setProperty('--dx', `${dx}px`);
                glitter.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(glitter);

                setTimeout(() => {
                    glitter.remove();
                }, 1200);
            }
        }
    </script>
</body>
</html>
