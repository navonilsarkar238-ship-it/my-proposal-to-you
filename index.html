<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Aditi ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      transition: background 1s ease;
    }

    /* Message Box Container */
    .message-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 450px;
      width: 90%;
      position: relative;
      transform: scale(0);
      animation: zoomInBurst 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes zoomInBurst {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      70% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h2 {
      color: #d63384;
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      margin-top: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    #nextBtn {
      background-color: #ff4b5c;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 92, 0.4);
    }

    #nextBtn:hover {
      transform: scale(1.05);
    }

    #yesBtn {
      background-color: #2a9d8f;
      color: white;
      display: none;
    }

    #yesBtn.shine {
      animation: shinePulse 1.2s infinite alternate;
    }

    @keyframes shinePulse {
      0% {
        box-shadow: 0 0 5px #2a9d8f, 0 0 10px #2a9d8f, 0 0 15px #2a9d8f;
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 15px #2a9d8f, 0 0 25px #2a9d8f, 0 0 35px #2a9d8f;
        transform: scale(1.08);
      }
    }

    #noBtn {
      background-color: #6c757d;
      color: white;
      display: none;
      position: absolute;
    }

    /* Sparkle particle effect */
    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: gold;
      border-radius: 50%;
      animation: burst 0.8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes burst {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="cardContainer"></div>

  <script>
    const steps = [
      {
        text: "From the very start, having you in my life has meant the world to me. ✨",
        bg: "linear-gradient(135deg, #ff9a9e, #fad0c4)"
      },
      {
        text: "Thank you for giving me your friendship... 💖",
        bg: "linear-gradient(135deg, #a1c4fd, #c2e9fb)"
      },
      {
        text: "...and thank you for tolerating this idiot every single day! 😜",
        bg: "linear-gradient(135deg, #fbc531, #e84118)"
      },
      {
        text: "Will you be mine? 💍",
        bg: "linear-gradient(135deg, #ff758c, #ff7eb3)",
        isProposal: true
      },
      {
        text: "Yay! Best decision ever! I love you, Aditi! 🥰🎉",
        bg: "linear-gradient(135deg, #11998e, #38ef7d)"
      }
    ];

    let currentStep = 0;
    const cardContainer = document.getElementById('cardContainer');

    function createSparkles(box) {
      const rect = box.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      for (let i = 0; i < 20; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 80;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        sparkle.style.setProperty('--dx', `${dx}px`);
        sparkle.style.setProperty('--dy', `${dy}px`);
        sparkle.style.left = `${centerX}px`;
        sparkle.style.top = `${centerY}px`;

        box.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
      }
    }

    function renderStep() {
      cardContainer.innerHTML = '';
      const step = steps[currentStep];

      // Change background animation
      document.body.style.background = step.bg;

      // Create new message box
      const box = document.createElement('div');
      box.className = 'message-box';

      const heading = document.createElement('h2');
      heading.textContent = step.text;
      box.appendChild(heading);

      const btnContainer = document.createElement('div');
      btnContainer.className = 'btn-container';

      if (!step.isProposal && currentStep < steps.length - 1) {
        const nextBtn = document.createElement('button');
        nextBtn.id = 'nextBtn';
        nextBtn.textContent = 'Next ❤️';
        nextBtn.onclick = () => {
          currentStep++;
          renderStep();
        };
        btnContainer.appendChild(nextBtn);
      } else if (step.isProposal) {
        const yesBtn = document.createElement('button');
        yesBtn.id = 'yesBtn';
        yesBtn.textContent = 'YES! 🥰';
        yesBtn.style.display = 'block';
        yesBtn.classList.add('shine');
        yesBtn.onclick = () => {
          currentStep = steps.length - 1;
          renderStep();
        };

        const noBtn = document.createElement('button');
        noBtn.id = 'noBtn';
        noBtn.textContent = 'No 😜';
        noBtn.style.display = 'block';

        // Make No button slide/run away on hover or touch
        const moveNoButton = () => {
          const x = (Math.random() - 0.5) * 200;
          const y = (Math.random() - 0.5) * 150;
          noBtn.style.transform = `translate(${x}px, ${y}px)`;
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        btnContainer.appendChild(yesBtn);
        btnContainer.appendChild(noBtn);
      }

      box.appendChild(btnContainer);
      cardContainer.appendChild(box);

      // Trigger sparkle burst animation on load
      setTimeout(() => {
        createSparkles(box);
      }, 100);
    }

    // Initialize first step
    renderStep();
  </script>
</body>
</html>
