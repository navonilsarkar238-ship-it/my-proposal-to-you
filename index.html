<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aditi 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2c163a 0%, #100818 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Romantic Dynamic Background Animation */
        .background-effects {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle, rgba(44, 22, 58, 1) 0%, rgba(16, 8, 24, 1) 100%);
            animation: bgPulse 8s infinite alternate ease-in-out;
        }

        @keyframes bgPulse {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.3); }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 107, 139, 0.5);
            font-size: 24px;
            animation: floatUp 5s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Shock / Flash Intro Overlay */
        .shock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 1;
            pointer-events: none;
            animation: flashIntro 0.8s forwards ease-out;
        }

        @keyframes flashIntro {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Container with Shock-Wave Entrance */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 182, 193, 0.4);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 107, 139, 0.4);
            animation: containerShockIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, cardPulse 4s infinite ease-in-out;
        }

        @keyframes containerShockIn {
            0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes cardPulse {
            0%, 100% { border-color: rgba(255, 182, 193, 0.3); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 107, 139, 0.2); }
            50% { border-color: rgba(255, 107, 139, 0.8); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 107, 139, 0.6); }
        }

        /* Message Box with Zoom-Pop & Dissapear Animation */
        .message-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .pop-zoom-animation {
            animation: zoomPopBox 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes zoomPopBox {
            0% {
                transform: scale(0.1) translateY(30px);
                opacity: 0;
                filter: blur(10px);
            }
            60% {
                transform: scale(1.1) translateY(-5px);
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
                filter: blur(0px);
            }
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.8rem;
            color: #ff7597;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 117, 151, 0.8);
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #fce4ec;
        }

        /* Button Styling */
        .btn {
            background: linear-gradient(135deg, #ff6b8b 0%, #ff4b72 100%);
            border: none;
            padding: 12px 32px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 114, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 75, 114, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Glitter & Sparkle Burst Effect */
        .glitter {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #fff 0%, #ff8da1 60%, transparent 100%);
            border-radius: 50%;
            animation: burst 1.2s forwards ease-out;
            z-index: 20;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Shock Flash Effect on Open -->
    <div class="shock-overlay"></div>

    <!-- Dynamic Background Effects -->
    <div class="background-effects" id="bg-effects"></div>

    <div class="container" id="main-container">
        <!-- Message Box -->
        <div class="message-box pop-zoom-animation" id="msg-box">
            <h1 id="title">Hey Aditi... ✨</h1>
            <p id="dynamic-text">Open this surprise with your whole heart! Click below to begin... 💖</p>
        </div>
        <button class="btn" id="next-btn" onclick="nextStep()">Open Message 💖</button>
    </div>

    <script>
        // Generate Starry Background & Floating Hearts
        const bgEffects = document.getElementById('bg-effects');
        
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3.5}px`;
            star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${1 + Math.random() * 2.5}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            bgEffects.appendChild(star);
        }

        const heartSymbols = ['💖', '✨', '💕', '💗', '🌟'];
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.animationDuration = `${3.5 + Math.random() * 3}s`;
            heart.style.animationDelay = `${Math.random() * 4}s`;
            heart.style.fontSize = `${Math.random() * 18 + 16}px`;
            bgEffects.appendChild(heart);
        }

        // Steps for the proposal sequence including your exact points
        const steps = [
            {
                title: "Hey Aditi... ✨",
                text: "Open this surprise with your whole heart! Click below to begin... 💖"
            },
            {
                title: "Thank You 🌸",
                text: "First of all, thank you so much for your wonderful friendship and for always bringing so much light into my life."
            },
            {
                title: "An Idiot's Apology 😅",
                text: "And a massive thank you for tolerating this absolute idiot all this time. You seriously deserve an award for your patience!"
            },
            {
                title: "A Little Secret 💫",
                text: "Every single conversation with you is the highlight of my day, and seeing your smile makes everything worthwhile."
            },
            {
                title: "My Proposal 💖",
                text: "Aditi, you mean the absolute world to me. Will you make me the happiest and be mine? ✨"
            },
            {
                title: "I Love You, Aditi ❤️",
                text: "You just made me the luckiest person alive! Closing this magical window now..."
            }
        ];

        let currentStep = 0;
        const titleEl = document.getElementById('title');
        const textEl = document.getElementById('dynamic-text');
        const btnEl = document.getElementById('next-btn');
        const msgBoxEl = document.getElementById('msg-box');
        const containerEl = document.getElementById('main-container');

        function nextStep() {
            currentStep++;

            if (currentStep < steps.length) {
                titleEl.innerText = steps[currentStep].title;
                textEl.innerText = steps[currentStep].text;
                
                if (currentStep === steps.length - 1) {
                    btnEl.style.display = "none"; // Hide button on the final ending message
                }
            }

            // Force restart the zoom-pop animation on the box
            msgBoxEl.classList.remove('pop-zoom-animation');
            void msgBoxEl.offsetWidth; 
            msgBoxEl.classList.add('pop-zoom-animation');

            // Trigger explosive glitter burst from the box
            createGlitterBurst();

            // If it's the final ending message, wait 4 seconds and auto-close / redirect the window
            if (currentStep === steps.length - 1) {
                setTimeout(() => {
                    // Dramatic fade out before closing
                    containerEl.style.transition = "all 1s ease";
                    containerEl.style.transform = "scale(0) rotate(15deg)";
                    containerEl.style.opacity = "0";
                    
                    setTimeout(() => {
                        window.close();
                        // Fallback if browser blocks window.close()
                        window.location.href = "about:blank";
                    }, 1000);
                }, 4000);
            }
        }

        function createGlitterBurst() {
            const rect = msgBoxEl.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 65; i++) {
                const glitter = document.createElement('div');
                glitter.classList.add('glitter');
                
                const size = Math.random() * 12 + 4;
                glitter.style.width = `${size}px`;
                glitter.style.height = `${size}px`;
                glitter.style.left = `${x}px`;
                glitter.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                glitter.style.setProperty('--dx', `${dx}px`);
                glitter.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(glitter);

                setTimeout(() => {
                    glitter.remove();
                }, 1200);
            }
        }
    </script>
</body>
</html>
