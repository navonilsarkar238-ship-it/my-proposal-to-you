<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise For Aditi ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;500;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: #090514;
    }

    /* Dynamic Canvas Background */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Stage */
    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Interactive Gift Box State */
    .gift-box-container {
      text-align: center;
      cursor: pointer;
      animation: floatGift 3s ease-in-out infinite;
    }

    .gift-box {
      font-size: 8rem;
      filter: drop-shadow(0 15px 25px rgba(255, 105, 180, 0.4));
      transition: transform 0.3s ease;
    }

    .gift-box:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .gift-instruction {
      color: #ffb6c1;
      font-weight: 500;
      font-size: 1.2rem;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
      letter-spacing: 1px;
    }

    @keyframes floatGift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Advanced Glassmorphism Message Card */
    .card {
      display: none;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 50px 40px;
      border-radius: 35px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
      text-align: center;
      width: 100%;
      transform: scale(0) rotate(-15deg);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.active {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      color: #ff9a9e;
      font-size: 2.2rem;
      margin-bottom: 35px;
      text-shadow: 0 0 20px rgba(255, 154, 158, 0.6);
      line-height: 1.4;
    }

    /* Button Layouts */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      position: relative;
      min-height: 70px;
      width: 100%;
    }

    .dev-btn {
      padding: 14px 38px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
    }

    #nextBtn {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 117, 140, 0.5);
    }

    #nextBtn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 30px rgba(255, 117, 140, 0.8);
    }

    /* Proposal Step Layouts (Side by Side) */
    .proposal-buttons {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      gap: 25px;
      position: relative;
      height: 70px;
    }

    #yesBtn {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: white;
      box-shadow: 0 0 20px rgba(0, 176, 155, 0.6);
      z-index: 10;
      animation: ultraShine 1.2s infinite alternate;
    }

    @keyframes ultraShine {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px #00b09b, 0 0 30px #96c93d;
      }
      100% {
        transform: scale(1.1);
        box-shadow: 0 0 30px #00ffcc, 0 0 50px #96c93d, 0 0 70px #00ffcc;
      }
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      transition: transform 0.15s ease-out;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Canvas Background for Complex Glitter & Particles -->
  <canvas id="particleCanvas"></canvas>

  <div class="stage">
    <!-- Gift Box Opening Screen -->
    <div class="gift-box-container" id="giftContainer" onclick="openGift()">
      <div class="gift-box">🎁</div>
      <div class="gift-instruction">Tap to open your surprise, Aditi ✨</div>
    </div>

    <!-- Dynamic Message Card Container -->
    <div class="card" id="mainCard">
      <h1 id="msgText"></h1>
      <div class="btn-container" id="actionArea"></div>
    </div>
  </div>

  <script>
    // --- ADVANCED PARTICLE ENGINE ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, customSpeed = 1) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || canvas.height + 20;
        this.size = Math.random() * 4 + 1;
        this.speedY = (Math.random() * 1.5 + 0.5) * customSpeed;
        this.speedX = (Math.random() - 0.5) * 1;
        this.color = `hsl(${Math.random() * 60 + 330}, 100%, ${Math.random() * 30 + 70}%)`;
        this.alpha = Math.random() * 0.7 + 0.3;
        this.decay = Math.random() * 0.005 + 0.002;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.alpha > 0) this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initAmbientParticles() {
      if (particles.length < 50 && Math.random() < 0.3) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      initAmbientParticles();
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0 || particles[i].y < 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function triggerBurst() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      for (let i = 0; i < 120; i++) {
        const p = new Particle(centerX, centerY, 3);
        p.speedX = (Math.random() - 0.5) * 8;
        p.speedY = (Math.random() - 0.5) * 8;
        particles.push(p);
      }
    }

    // --- STORYLINE DATA ---
    const storyline = [
      { text: "From the very start, having you in my life changed everything... ✨" },
      { text: "Thank you for giving me your wonderful friendship. 💖" },
      { text: "And thank you for constantly tolerating this absolute idiot every single day! 😜" },
      { text: "So at last... Will you be mine, Aditi? 💍", isProposal: true },
      { text: "Yay!! Best decision ever! I love you so much, Aditi! 🥰🎉" }
    ];

    let currentStep = 0;
    const giftContainer = document.getElementById('giftContainer');
    const mainCard = document.getElementById('mainCard');
    const msgText = document.getElementById('msgText');
    const actionArea = document.getElementById('actionArea');

    function openGift() {
      triggerBurst();
      giftContainer.style.transition = "all 0.5s ease";
      giftContainer.style.transform = "scale(2)";
      giftContainer.style.opacity = "0";
      setTimeout(() => {
        giftContainer.style.display = 'none';
        mainCard.style.display = 'block';
        setTimeout(() => mainCard.classList.add('active'), 50);
        renderStep();
      }, 400);
    }

    function renderStep() {
      triggerBurst();
      mainCard.classList.remove('active');
      
      setTimeout(() => {
        const step = storyline[currentStep];
        msgText.textContent = step.text;
        actionArea.innerHTML = '';

        if (!step.isProposal && currentStep < storyline.length - 1) {
          const nextBtn = document.createElement('button');
          nextBtn.className = 'dev-btn';
          nextBtn.id = 'nextBtn';
          nextBtn.textContent = 'Continue ✨';
          nextBtn.onclick = () => {
            currentStep++;
            renderStep();
          };
          actionArea.appendChild(nextBtn);
        } else if (step.isProposal) {
          const proposalWrapper = document.createElement('div');
          proposalWrapper.className = 'proposal-buttons';

          const yesBtn = document.createElement('button');
          yesBtn.className = 'dev-btn';
          yesBtn.id = 'yesBtn';
          yesBtn.textContent = 'YES! 🥰';
          yesBtn.onclick = () => {
            currentStep = storyline.length - 1;
            renderStep();
          };

          const noBtn = document.createElement('button');
          noBtn.className = 'dev-btn';
          noBtn.id = 'noBtn';
          noBtn.textContent = 'No 😜';

          // Side-by-side dodging logic: instantly jumps away when hovered or touched
          const moveNoButton = (e) => {
            e.preventDefault();
            const randomX = (Math.random() - 0.5) * 300;
            const randomY = (Math.random() - 0.5) * 180;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
          };

          noBtn.addEventListener('mouseover', moveNoButton);
          noBtn.addEventListener('touchstart', moveNoButton);
          noBtn.addEventListener('click', moveNoButton);

          proposalWrapper.appendChild(yesBtn);
          proposalWrapper.appendChild(noBtn);
          actionArea.appendChild(proposalWrapper);
        }

        mainCard.classList.add('active');
      }, 400);
    }
  </script>
</body>
</html>
